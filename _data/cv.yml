# CV data rendered on /cv/ (cv_format: rendercv in _pages/cv.md).
# Only education (from Politecnico onwards) and work experience are published on the site.
# Contact fields (name, email, phone, address) are intentionally omitted: the CV layout prints them unprotected.
#
# The field values are deliberately swapped so the university/company is the bold headline:
# al_folio_cv renders `degree` / `position` as the bold title and `institution` / `company` as the line below.
# Education: `degree` holds the university, `institution` holds the degree.
# Experience: `position` holds the company, `company` holds the role.
cv:
  sections:
    Education:
      - degree: University of Oxford
        institution: DPhil in Computer Science
        location: Oxford, UK
        start_date: 2026
        end_date: 2029

      - degree: University of Oxford
        institution: Visiting Student in Mathematics
        location: Oxford, UK
        date: 2023

      - degree: Politecnico di Torino
        institution: M.Sc. Physics of Complex Systems
        location: Turin, Italy
        start_date: 2021
        end_date: 2023
        highlights:
          - "Final grade: 110/110 cum laude"

      - degree: Sorbonne Université
        institution: M.Sc. Theoretical Physics
        location: Paris, France
        start_date: 2022
        end_date: 2023

    Experience:
      - position: Morgan Stanley
        company: Quantitative Strategist — FX & Fixed Income
        start_date: 2024
        end_date: 2026

      - position: Bain & Company
        company: Strategy Consultant — Advanced Analytics Group
        start_date: 2023
        end_date: 2024
